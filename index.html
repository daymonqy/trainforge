<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ForgeFit — Zaawansowany dziennik treningowy</title>
  <meta name="description" content="Kompletny system treningowy: plany, live workout, RIR/RPE, regeneracja, progres, baza ćwiczeń." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forge: {
              50: '#ecfdf8', 100: '#d1faf0', 200: '#a7f3e1', 300: '#6ee7cb',
              400: '#34d3ad', 500: '#00d4aa', 600: '#00b894', 700: '#009474',
              800: '#00765d', 900: '#065f4b', 950: '#033b30'
            },
            dark: { 850: '#1a1d24', 900: '#12141a', 950: '#0a0c10' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-dark-950 text-gray-100 font-sans antialiased min-h-screen">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-dark-900 border-t border-gray-800 z-50 safe-bottom hidden">
    <div class="flex justify-around items-center h-16 max-w-lg mx-auto">
      <button data-route="dashboard" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
        <span class="text-[10px] font-medium">Start</span>
      </button>
      <button data-route="workout" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span class="text-[10px] font-medium">Trening</span>
      </button>
      <button data-route="exercises" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-[10px] font-medium">Ćwiczenia</span>
      </button>
      <button data-route="plans" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span class="text-[10px] font-medium">Plany</span>
      </button>
      <button data-route="recovery" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span class="text-[10px] font-medium">Regeneracja</span>
      </button>
      <button data-route="profile" class="nav-btn flex flex-col items-center gap-0.5 text-gray-400 hover:text-forge-400 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-medium">Profil</span>
      </button>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
